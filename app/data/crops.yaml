# Master crop list — the agronomic side of the contract. Economics (prices, yields, costs)
# lives with the economics model, keyed by `id`.
#
# Sources (values are typical / approximate and MUST be verified before the final pitch):
#   - FAO EcoCrop database: temp_c, rain_mm (over the growing cycle), ph, cycle_days, frost
#   - FAO Irrigation & Drainage Paper 56, Tables 11 & 12: kc (ini/mid/end), stage_days
#   - Nitrogen numbers: typical extension-service ranges (kg N/ha). credit_to_next = N left
#     for the following crop (legumes, alfalfa).
#   - min_return_years: minimum years before the same crop should return (disease / pest cycles)
#
# Units: °C, mm, kg/ha, days, m.
#
# Field meaning:
#   cycle_days        min/typ/max planting->harvest (EcoCrop); typ drives the harvest window
#   gdd               base temperature and (if known) degree-days to maturity (base_c, to_maturity)
#   temp_c            EcoCrop envelope: abs_min < opt_min <= opt_max < abs_max (mean temp over cycle)
#   rain_mm           EcoCrop envelope for total rain over the cycle (rainfed)
#   kill_frost_c      air temperature that kills the crop (used for the planting window)
#   kc / stage_days   FAO-56 crop coefficient and stage lengths [initial, development, mid, late]
#   sensitive_stage   fraction of cycle where heat hurts most, with the heat threshold
#   fall_sown         true for crops planted before winter and harvested next summer
#   role              cash | cover | forage
#   harvester_class   grain_combine | root_harvester | forage_harvester | cotton_picker | cane_harvester | manual | none

crops:
  - id: maize
    name: Maize (grain corn)
    family: Poaceae
    role: cash
    cycle_days: {min: 90, typ: 130, max: 180}
    gdd: {base_c: 10, to_maturity: 1400}
    temp_c: {abs_min: 10, opt_min: 18, opt_max: 33, abs_max: 47}
    rain_mm: {abs_min: 400, opt_min: 600, opt_max: 1200, abs_max: 1800}
    ph: {abs_min: 4.5, opt_min: 5.5, opt_max: 7.0, abs_max: 8.5}
    kill_frost_c: -1
    kc: {ini: 0.30, mid: 1.20, end: 0.60}
    stage_days: [30, 40, 50, 30]
    sensitive_stage: {start_frac: 0.45, end_frac: 0.62, name: silking, heat_threshold_c: 35}
    root_depth_m: 1.5
    nitrogen: {requirement_kg_ha: 180, credit_to_next_kg_ha: 0}
    min_return_years: 1
    tolerates_poor_drainage: false
    harvester_class: grain_combine
    planter_class: row_planter
    rainfed_ok: true

